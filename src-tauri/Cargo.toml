[package]
name = "shanhe-chengyi"
version = "0.9.0"
description = "山河城邑 · 3D 旅行记录"
authors = ["ankon"]
edition = "2021"
rust-version = "1.77.2"

# 移动端（后续 Android APK）需要 lib target，桌面端通过 lib 入口启动
[lib]
name = "shanhe_chengyi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 照片读写：上传 / 删除落盘到「省/市/区县」文件夹（桌面与移动端）
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"

[features]
# 由 tauri-build 自动打开
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
